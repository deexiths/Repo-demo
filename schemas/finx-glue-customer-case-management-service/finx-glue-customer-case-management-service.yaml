      type: string
      description: ">\r

        * `PerformanceAnalysis` - \r

        * `ActivityAnalysis` - \r

        * `RevenueAnalysis` - \r

        * `CostAnalysis` - \r

        * `PredictiveAnalysis` - \r

        * `BehavioralAnalysis` - \r

        * `ProfitabilityAnalysis` - \r

        * `CompetitiveAnalysis` - \r

        * `CohortAnalysis` - \r

        * `SegmentAnalysis` - \r

        * `SWOTAnalysis` - \r

        * `Benchmarking` - \r

        * `PositioningAnalysis` - \r

        * `ScenarioAnalysis` - \r

        * `IntelligenceGathering` - \r

        * `Profiling` - \r\n"
    Schedule:
      type: object
      properties:
        ScheduleType:
          type: string
          description: ""
          format: Text
      description: The schedule and timing of the analysis performed using the algorithm
    Analysis:
      type: object
      properties:
        AnalysisType:
