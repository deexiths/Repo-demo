components:
  schemas:
    HTTPError:
      type: object
      properties:
        status_code:
          type: string
          format: string
        status:
          type: string
          format: string
        message:
          type: string
          format: string
      description: Status Attributes
    Currencycode:
      type: object
      properties:
        Currencycode:
          type: string
          description: >+
            A code identifying a currency according to ISO-4217.

            A currency is a system of money in general use in a particular
            country.


            Code allocated to a currency, by a maintenance agency, under an
            international identification scheme as described in the latest
            edition of the international standard ISO 4217 "Codes for the
            representation of currencies and funds". Valid currency codes are
            registered with the ISO 4217 Maintenance Agency, and consist of
            three contiguous letters. (ISO20022)

          format: DataType
      description: ""
    Amounttypevalues:
      enum:
        - Principal
        - Actual
        - Estimated
        - Maximum
        - Default
        - Replacement
        - Incremental
        - Decremental
        - Reserved
        - Available
        - Used
        - DuePayable
        - Minimum
        - Open
        - Unknown
        - Fixed
      type: string
      description: ">\r

        * `Principal` - \r

        * `Actual` - Actual amount.\r

        * `Estimated` - Estimated amount (the final amount could be above or
        below).\r

        * `Maximum` - Maximum amount (the final amount must be less or equal).\r

        * `Default` - Default amount.\r

        * `Replacement` - Replacement amount.\r

        * `Incremental` - Incremental amount for reservation.\r

        * `Decremental` - Decremental amount for reservation.\r

        * `Reserved` - Reserved or updated reserved amount for reservation.\r

        * `Available` - \r

        * `Used` - \r

        * `DuePayable` - \r

        * `Minimum` - \r

        * `Open` - The amount is open.(ISO20022)\r

        * `Unknown` - The amount is unkown.(ISO20022)\r

        * `Fixed` - The amount represents a fixed value.(ISO20022)\r\n"
    Amount:
      type: object
      properties:
        AmountValue:
          type: string
          description: ""
          format: Value
        AmountCurrency:
          $ref: "#/components/schemas/Currencycode"
        DecimalPointPosition:
          type: string
          description: |
            Decimal point position starts calulating from the right
          format: Text
        AmountType:
          $ref: "#/components/schemas/Amounttypevalues"
      description: The statistical analysis that can include historical and trended
        views of the activity
    Performance:
      type: object
      properties:
        CustomerCaseResourceUtilization:
          type: string
          description: Record of the customer case resolution resource utilization (target
            and actual)
          format: Object
        CustomerCaseLoadingProjections:
          type: string
          description: Estimated projected customer case resource requirements and
            utilization and loading based on historical patterns and anticipated
            activity
          format: Object
        CustomerCaseResolutionServiceStatistics:
          type: string
          description: Tracked activity and performance statistics used to manage the case
            resolution business function
          format: Object
        CustomerCaseServiceStatisticType:
          type: string
          description: The type of activity that is tracked and analyzed (e.g. case
            resolution throughput, time/effort per case, customer
            acceptance/appeal rate, merchant acceptance/appeal rate,
            customer/merchant retention, case resolution profit/loss)
          format: Text
        CustomerCaseServiceStatisticValue:
          $ref: "#/components/schemas/Amount"
        CustomerCaseServiceStatisticInterpretation:
          type: string
          description: The evaluation of the root cause or comparative assessments of the
            analysis
          format: Object
        CustomerCaseServiceStatisticRecommendation:
          type: string
          description: Service/configuration amendment recommendations arising from the
            statistical analysis
          format: Object
      description: |-
        A collection of one or more responsibilities or tasks under management

        Examples: Relationship development, Troubleshooting
    Rulesettypevalues:
      enum:
        - Policy
        - Regulation
        - Law
        - Guideline
        - Criterion
        - Standard
      type: string
      description: ">\r

        * `Policy` - Rule that governs business execution.


        The set of basic principles and associated guidelines, formulated and
        enforced by the governing body of an organization, to direct and limit
        its actions in pursuit of long-term goals. (Business Dictionary)

        \r

        * `Regulation` - A rule used to carry out a law (FIBO)


        Business Dictionary: a rule (with or without the coercive power of law)
        employed in controlling, directing, or managing an activity,
        organization, or system.\ 


        The set of rules and legislation governing certain actions.\ 

        https://financial-dictionary.thefreedictionary.com/Regulatory\r

        * `Law` - A binding rule that the courts will enforce.

        A system of rules and guidelines which are enforced through social
        institutions to govern behavior. (FIBO)

        \r

        * `Guideline` - A recommended practice (adapted from Business
        Dictionary)

        A general rule, principle, or piece of advice.\r

        * `Criterion` - A principle or standard by which something may be judged
        or decided.


        Read more: http://www.businessdictionary.com/definition/criterion.html\r

        * `Standard` - A rule considered by an authority or by general consent
        as a basis of comparison\r\n"
    Name:
      type: object
      properties:
        Name:
          type: string
          description: A name is a word or phrase that constitutes the distinctive
            designation of a person, place, thing or concept. (UN/CEFAT)
          format: DataType
      description: ""
    Involvedparty:
      type: object
      properties:
        PartyReference:
          type: string
          description: Reference to a Party who plays a specific role
          format: Text
        InvolvementReference:
          type: string
          description: Reference to a specific Role that is played by a Party
          format: Text
      description: >-
        Reference to an entity that assigns and manages the identification.

        tReference to the organization or agency that issued the identifier
        (e.g., DMV, Passport Office).
    Datetimetypevalues:
      enum:
        - MaturityDate
        - InitiatedDate
        - RequestedDate
        - ExecutedDate
        - OpenDate
        - CloseDate
        - ExpiryDate
        - EffectiveDate
        - CreatingDate
        - ActivationDate
        - DeactivationDate
        - BlockingDate
        - SendingDate
        - ValidFromDate
        - ValidToDate
        - ReceivingDate
        - SigningDate
        - DueDate
        - ValueDate
        - FulfillmentDate
        - EntryDate
      type: string
      description: ">\r

        * `MaturityDate` - \r

        * `InitiatedDate` - \r

        * `RequestedDate` - \r

        * `ExecutedDate` - \r

        * `OpenDate` - \r

        * `CloseDate` - \r

        * `ExpiryDate` - \r

        * `EffectiveDate` - \r

        * `CreatingDate` - \r

        * `ActivationDate` - \r

        * `DeactivationDate` - \r

        * `BlockingDate` - \r

        * `SendingDate` - \r

        * `ValidFromDate` - \r

        * `ValidToDate` - \r

        * `ReceivingDate` - \r

        * `SigningDate` - \r

        * `DueDate` - \r

        * `ValueDate` - \r

        * `FulfillmentDate` - \r

        * `EntryDate` - \r\n"
    Datetime:
      type: object
      properties:
        DateTimeContent:
          type: string
          description: The particular date and time point in the progression of time
          format: Text
        TimeZoneCode:
          type: string
          description: The time zone to which the date time refers.
          format: Text
        DaylightSavingIndicator:
          type: string
          description: ""
          format: Text
        DateTimeType:
          $ref: "#/components/schemas/Datetimetypevalues"
      description: The date when the identifier became valid.
    Identifier:
      type: object
      properties:
        IdentifierValue:
          type: string
          description: tThe actual unique code or number (e.g., passport number, drivers
