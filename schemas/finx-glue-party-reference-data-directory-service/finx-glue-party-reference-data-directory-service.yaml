components:
  schemas:
    HTTPError:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
        error:
          type: string
        path:
          type: string
        status_code:
          type: integer
          format: int32
        message:
          type: string
      additionalProperties: true
      description: Error response returned by the service (Spring ProblemDetail / default error / handled error).
    Partytypevalues:
      enum:
        - Person
        - Organisation
      type: string
      description: 'Type of party (Person or Organisation)'
    Partylegalstructuretypevalues:
      enum:
        - Individual
        - CommunityInterestCompany
        - CharitableIncorporatedOrganisation
        - Co-Operative
        - Charity
        - GeneralPartnership
        - LimitedLiabilityPartnership
        - ScottishLimitedPartnership
        - LimitedPartnership
        - PrivateLimitedCompany
        - PublicLimitedCompany
        - Sole(SoleTrader)
      type: string
      description: 'Type of party legal structure'
    Partyidentificationtypevalues:
      enum:
        - Taxidentificationnumber
        - Nationalregistrationnumber
        - Registrationauthorityidentification
        - LEI(LegalEntityIdentifier)
        - Alienregistrationnumber
        - Passportnumber
        - Taxexemptidentificationnumber
        - Corporateidentification
        - Driverlicensenumber
        - Foreigninvestmentidentitynumber
        - Customeridentificationnumber
        - Coreidentificationnumber
        - Socialsecuritynumber
        - Identitycardnumber
        - Concat
        - Nationalregistrationidentificationnumber
      type: string
      description: 'Type of party identification'
    Partyidentification:
      type: object
      properties:
        PartyIdentificationType:
          $ref: '#/components/schemas/Partyidentificationtypevalues'
        PartyIdentification:
          $ref: '#/components/schemas/Identifier'
      description: ''
    Party:
      type: object
      properties:
        PartyName:
          $ref: '#/components/schemas/Name'
        PartyType:
          $ref: '#/components/schemas/Partytypevalues'
        PartyDateTime:
          $ref: '#/components/schemas/Datetime'
        PartyIdentification:
          type: array
          items:
            $ref: '#/components/schemas/Partyidentification'
        PartyLegalStructureType:
          $ref: '#/components/schemas/Partylegalstructuretypevalues'
      description: Reference to the associated customer (can be a person or a company)
    Productserviceagreementinvolvementtypevalues:
      enum:
        - Principal
        - SecondaryOwner
        - Beneficiary
        - PowerOfAttorney
        - LegalGuardian
        - CustodianForMinor
        - SuccessorOnDeath
        - Administrator
        - OtherParty
        - Granter
        - Settlor
        - SeniorManagingOfficial
        - Protector
        - RegisteredShareholderName
      type: string
      description: 'Type of product/service agreement involvement'
    NameInformation:
      type: object
      properties:
        FirstName:
          type: string
        MiddleName:
          type: string
        LastName:
          type: string
        FullName:
          type: string
      description: 'Structured name information for a party'
    Involvedparty:
      type: object
      properties:
        PartyReference:
          type: string
          description: Reference to a Party who plays a specific role
          format: Text
        InvolvementReference:
          type: string
          description: Reference to a specific Role that is played by a Party
          format: Text
      description: Reference to the customer's employer (company name)
    Demographics:
      type: object
      properties:
        Socio-EconomicClassification:
          type: string
          description: A bank defined classification of the socio-economic rating and prospect
          format: Text
        Ethnicity:
          type: string
          description: Where needed to ensure the bank's handling of the relationship follows legal and regulatory requirements
          format: Text
        Religion:
          type: string
          description: Where needed to ensure the bank's handling of the relationship follows legal and regulatory requirements
          format: Text
        Employment:
          $ref: '#/components/schemas/Involvedparty'
        EmploymentHistory:
          type: string
          description: 'Details of the customer''s employment history (e.g. employer, dates, job position, salary)'
          format: Text
        EducationHistory:
          type: string
          description: 'Customer''s education (e.g. academic institutions attended, duration, qualifications and certifications)'
          format: Text
        ServicingConstraints:
          type: string
          description: 'Description of any known constraints on servicing the customer (sight, hearing, religious considerations)'
          format: Text
      description: "\"An assertion or statement with regard to a concept, a characteristic.\n\nExamples: Product pricing rules, Customer reference details\n\nA descriptor can be atomic or composed.\"\nProspect Management"
    Party_Partyrelationshiptypevalues:
      enum:
        - PartyIsParentOfParty
        - PartyIsSubsidiaryOfParty
        - PartyIsCertifiedByParty
        - PartyIsMarriedToParty
        - PartyActsOnBehalfOfParty
        - PartyIsContactPointForParty
        - PartyIsTrustedByParty
        - PartyIsThePowerOfAttorneyForParty
        - PartyReceivesBenefitsFromAParty
      type: string
      description: ">\r\n* `PartyIsParentOfParty` - \r\n* `PartyIsSubsidiaryOfParty` - \r\n* `PartyIsCertifiedByParty` - \r\n* `PartyIsMarriedToParty` - \r\n* `PartyActsOnBehalfOfParty` - \r\n* `PartyIsContactPointForParty` - \r\n* `PartyIsTrustedByParty` - \r\n* `PartyIsThePowerOfAttorneyForParty` - \r\n* `PartyReceivesBenefitsFromAParty` - \r\n"
    Subject:
      type: object
      properties:
        Subject:
          type: string
          description: A thing that is discussed or dealt whit in agreement/arrangement about doing or not doing (as action) something.
          format: Class
      description: ''
    Arrangementtypevalues:
      enum:
        - SweepArrangement
        - WithdrawalArrangement
        - DepositArrangement
        - InterestArrangement
        - FeeArrangement
        - LienArrangement
        - InformationArrangement
        - PaymentArrangement
        - EntitlementArrangement
        - PeriodArrangement
        - CollateralArrangement
        - LimitArrangement
        - AccessArrangement
        - CardPaymentArrangement
        - StandingOrderArrangement
        - OverdraftArrangement
        - RepaymentArrangement
        - StatementArrangement
        - CreditTransferArrangement
        - ProductAndServiceArrangement
        - FactoringArrangement
        - RolloverArrangement
        - RestructuringArrangement
        - InsuranceArrangement
        - CollectionArrangement
        - UnderwritingArrangement
        - TerminationArrangement
        - MaturityArrangement
        - AdministrativeArrangement
      type: string
      description: ">\r\n* `SweepArrangement` - An arrangement into which is promised for the set-up and execution of structured sweeps to and from the facility to a linked account.\r\n* `WithdrawalArrangement` - An arrangement into which is promised to deliver Withdraw Service  to take fund out of an account. \r\n* `DepositArrangement` - An arrangement into which is promised to deliver Deposit Service  to place funds into an account for safekeeping. \r\n* `InterestArrangement` - An arrangement into which is promised to apply a pricing element expressed in a percentage  to a principal amount.\r\n* `FeeArrangement` - An arrangement into which is promised to apply a charge for services rendered. \r\n* `LienArrangement` - An arrangement into which is promised for placing a lien or block on the account for a specified purpose, amount, and period. \r\n* `InformationArrangement` - An arrangement concerning the information the bank will provide about the agreement/account\r\n* `PaymentArrangement` - An arrangement into which is promised to deliver a specific payment service including regular payments, standing orders, direct debits and bill pay instructions. \r\n* `EntitlementArrangement` - Right or obligation linked to the involvement of a party in an agreement\r\n* `PeriodArrangement` - \r\n* `CollateralArrangement` - An arrangement into which is promised for handling the oversight of the allocation, valuation and administration of collateral associated with the facility. \r\n* `LimitArrangement` - An arrangement to limit something\ne.g., the number of transaction per week, the amount of money allowed to withdraw per week/day and etc. \r\n* `AccessArrangement` - An arrangement that allows or restricts the access to a service or product, channel or device through a specific access point\r\n* `CardPaymentArrangement` - An arrangement into which is promised to deliver Card payment Service to execute payment transactions through a payment card, including online payments. \r\n* `StandingOrderArrangement` - An arrangement into which is promised to deliver Standing Order Service to make regular transfers on given dates to a named beneﬁciary. \r\n* `OverdraftArrangement` - An arrangement into which is promised to deliver Overdraft Service  that allows fund transfer even if there is no provision on the account. \r\n* `RepaymentArrangement` - An arrangement into which is promised for paying back money previously borrowed from a lender. \r\n* `StatementArrangement` - An arrangement into which is promised to deliver a reporting service on payment transactions registered on an account. \r\n* `CreditTransferArrangement` - An arrangement into which is promised to allow a payer to transfer fund to a beneficiary. \r\n* `ProductAndServiceArrangement` - \r\n* `FactoringArrangement` - \r\n* `RolloverArrangement` - Arrangement stipulating the modalities for an automatic renewal of the agreement\n\ni.e. the replacement of the agreement with a new one without renewed negociation and witout explicit agreement of the customer \r\n* `RestructuringArrangement` - \r\n* `InsuranceArrangement` - \r\n* `CollectionArrangement` - An arrangement into which is promised to collect past-due debts from borrowers\r\n* `UnderwritingArrangement` - A contractual agreement between parties that commits the underwriter to assuming risk.\r\n* `TerminationArrangement` - \r\n* `MaturityArrangement` - \r\n* `AdministrativeArrangement` - \r\n"
